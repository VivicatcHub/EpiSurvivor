services:
  local:
    image: postgres:16
    env_file: .env
    ports:
      # Acces depuis l'hote uniquement (psql, DBeaver, alembic hors conteneur).
      # Le back, lui, passe par le reseau docker ci-dessous.
      - "127.0.0.1:${POSTGRES_PORT:-5555}:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:

networks:
  default:
    name: geo-emploi-db
